<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" fill="none" role="img" aria-label="Tượng Phật">
  <defs>
    <linearGradient id="goldBody" x1="160" y1="40" x2="160" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5e6b8"/>
      <stop offset="35%" stop-color="#d4a84b"/>
      <stop offset="70%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#8a6410"/>
    </linearGradient>
    <linearGradient id="goldRobe" x1="80" y1="200" x2="240" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="50%" stop-color="#c49a2a"/>
      <stop offset="100%" stop-color="#7a5510"/>
    </linearGradient>
    <radialGradient id="goldHalo" cx="50%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#e8c050" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d49c2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#b8860b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Hào quang -->
  <circle cx="160" cy="118" r="108" fill="url(#goldHalo)"/>
  <circle cx="160" cy="118" r="92" fill="none" stroke="#d4a84b" stroke-width="1.5" opacity="0.35"/>
  <circle cx="160" cy="118" r="78" fill="none" stroke="#e8c96a" stroke-width="1" opacity="0.25"/>

  <g filter="url(#softGlow)">
    <!-- Tóc ushnisha -->
    <ellipse cx="160" cy="58" rx="22" ry="16" fill="#5c4017"/>
    <circle cx="160" cy="72" r="38" fill="#5c4017"/>
    <!-- Ốc tóc -->
    <circle cx="148" cy="62" r="4" fill="#3d2910" opacity="0.6"/>
    <circle cx="172" cy="62" r="4" fill="#3d2910" opacity="0.6"/>
    <circle cx="160" cy="54" r="4" fill="#3d2910" opacity="0.6"/>
    <circle cx="142" cy="74" r="3.5" fill="#3d2910" opacity="0.5"/>
    <circle cx="178" cy="74" r="3.5" fill="#3d2910" opacity="0.5"/>

    <!-- Mặt -->
    <ellipse cx="160" cy="100" rx="34" ry="38" fill="url(#goldBody)"/>
    <!-- Mắt nửa nhắm -->
    <path d="M140 98 Q148 102 156 98" stroke="#5c4017" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M164 98 Q172 102 180 98" stroke="#5c4017" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Mũi -->
    <path d="M160 102 L158 112 L162 112" stroke="#8a6410" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    <!-- Miệng mỉm -->
    <path d="M150 120 Q160 126 170 120" stroke="#8a6410" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- 白毫 -->
    <circle cx="160" cy="88" r="2.2" fill="#fff8e0" opacity="0.9"/>

    <!-- Cổ -->
    <rect x="148" y="132" width="24" height="14" rx="4" fill="url(#goldBody)"/>

    <!-- Vai / thân -->
    <path d="M100 160 C100 148 120 142 160 142 C200 142 220 148 220 160 L228 250 C228 280 200 300 160 300 C120 300 92 280 92 250 Z" fill="url(#goldRobe)"/>
    <!-- Nếp áo -->
    <path d="M160 150 C140 190 130 230 128 280" stroke="#8a6410" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M160 150 C180 190 190 230 192 280" stroke="#8a6410" stroke-width="1.5" fill="none" opacity="0.35"/>
    <path d="M120 200 Q160 220 200 200" stroke="#f5e6b8" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- Tay thiền định -->
    <ellipse cx="160" cy="248" rx="48" ry="18" fill="url(#goldBody)" opacity="0.95"/>
    <ellipse cx="160" cy="246" rx="36" ry="12" fill="#e8c96a" opacity="0.5"/>

    <!-- Chân kiết già -->
    <ellipse cx="160" cy="320" rx="70" ry="28" fill="url(#goldRobe)"/>
    <ellipse cx="160" cy="318" rx="50" ry="16" fill="#e8c96a" opacity="0.35"/>
    <!-- Tọa đài sen -->
    <ellipse cx="160" cy="348" rx="90" ry="22" fill="#c45c6a" opacity="0.55"/>
    <ellipse cx="160" cy="344" rx="70" ry="14" fill="#e88a9c" opacity="0.45"/>
    <ellipse cx="160" cy="340" rx="48" ry="10" fill="#f2c4d0" opacity="0.4"/>
  </g>
</svg>
