version: '3.8'

services:
  cert_word_sync:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_word_sync_app
    restart: always
    ports:
      - "5055:5055"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./clients:/app/clients
      - ./templates:/app/templates
      - ./outputs:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5055/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
