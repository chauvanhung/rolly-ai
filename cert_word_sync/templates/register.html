<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng Ký - Cert Word Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=1.3">
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
      }
      .auth-card {
        width: 100%;
        max-width: 440px;
        background: rgba(30, 41, 59, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: var(--radius-xl);
        padding: 40px 36px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: fade-in 0.4s ease;
      }
      .auth-brand {
        text-align: center;
        margin-bottom: 32px;
      }
      .auth-logo-badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, var(--accent-emerald), var(--accent-cyan));
        border-radius: var(--radius-lg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5);
      }
      .auth-title {
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 6px;
      }
      .auth-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
      }
      .alert-box {
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 13px;
        margin-bottom: 20px;
      }
      .alert-error {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo-badge">
          <svg width="28" height="28" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h1 class="auth-title">Đăng Ký Tài Khoản</h1>
        <p class="auth-subtitle">Tạo tài khoản mới để đồng bộ chứng thư Word</p>
      </div>

      {% if error %}
      <div class="alert-box alert-error">
        ⚠️ {{ error }}
      </div>
      {% endif %}

      <form action="/register" method="post">
        <div class="form-group">
          <label class="form-label">Họ và Tên</label>
          <input type="text" name="full_name" class="form-control" placeholder="Nguyễn Văn A">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Mật khẩu</label>
          <input type="password" name="password" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 10px;">
          ✨ Tạo Tài Khoản Mới
        </button>
      </form>

      <p style="text-align: center; font-size: 13px; color: var(--text-secondary); margin-top: 24px;">
        Đã có tài khoản? <a href="/login" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Đăng nhập ngay</a>
      </p>
    </div>
  </body>
</html>
