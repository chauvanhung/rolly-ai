<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thông Báo Lỗi - Cert Word Sync</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
      .error-card {
        max-width: 600px;
        margin: 80px auto;
        background: rgba(30, 41, 59, 0.8);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 20px;
        padding: 40px 30px;
        text-align: center;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
      }
      .error-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px auto;
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="error-card">
        <div class="error-icon">⚠️</div>
        <h2 style="color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 12px;">Đã Xảy Ra Sự Cố</h2>
        <p style="color: #cbd5e1; font-size: 14px; line-height: 1.6; margin-bottom: 24px;">
          {{ error or 'Hệ thống vừa gặp phải gián đoạn nhỏ. Vui lòng quay lại trang chủ và thử lại thao tác.' }}
        </p>
        <div style="display: flex; justify-content: center; gap: 12px;">
          <a href="/" class="btn btn-primary" style="padding: 10px 24px; border-radius: 24px; text-decoration: none;">
            🏠 Quay lại Trang Chủ
          </a>
          <a href="/login" class="btn btn-secondary" style="padding: 10px 24px; border-radius: 24px; text-decoration: none;">
            🔑 Đăng nhập lại
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
